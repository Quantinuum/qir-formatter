[project]
name = "qir-formatter"
version = "0.1.0"
description = "A Python library for QIR Alliance results formatting."
authors = [
  { name = "Peter Schow", email = "peter.schow@quantinuum.com" },
  { name = "Chester Wringe", email = "chester.wringe@quantinuum.com" },
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = ["pydantic>=2"]

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = ["ruff>=0.14", "ty>=0.0.1a16"]
test = ["pytest>=8.2"]

[tool.ruff]
target-version = "py310"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python-version = "3.10"

[tool.uv.sources]
