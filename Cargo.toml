[package]
name = "qir-formatter"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Rust implementation of the QIR labeled results formatter"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/Quantinuum/qir-formatter"
documentation = "https://docs.rs/qir-formatter"
keywords = ["qir", "quantum", "formatter", "results"]
categories = ["encoding", "science", "science::quantum-computing"]

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
log = "0.4"
pyo3 = { version = "0.29.2", features = ["abi3-py310", "experimental-inspect"], optional = true }
