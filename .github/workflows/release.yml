name: Create release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"

defaults:
  run:
    shell: bash

jobs:
  crate:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Update CA certificates
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
      - name: Update Rust
        run: rustup update
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify package
        run: cargo publish --dry-run --locked
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  wheels:
    name: Wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux2014_x86_64:latest
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            # Build natively on the ARM runner, rather than using a cross-compilation image.
            container: quay.io/pypa/manylinux2014_aarch64:latest
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: latest
      - name: Update macOS Rustup and CA certificates
        if: runner.os == 'macOS'
        run: |
          brew update
          brew upgrade rustup ca-certificates
          echo "$(brew --prefix rustup)/bin" >> "$GITHUB_PATH"
          bundle="$(brew --prefix)/etc/ca-certificates/cert.pem"
          for name in SSL_CERT_FILE CURL_CA_BUNDLE CARGO_HTTP_CAINFO GIT_SSL_CAINFO; do
            printf '%s=%s\n' "$name" "$bundle" >> "$GITHUB_ENV"
          done
      - name: Update Rust
        if: runner.os == 'Windows'
        run: rustup update
      - name: Pull latest manylinux image
        if: runner.os == 'Linux'
        env:
          MANYLINUX_IMAGE: ${{ matrix.container }}
        run: docker pull "$MANYLINUX_IMAGE"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: "2014"
          container: ${{ matrix.container }}
          docker-options: --env RUSTUP_VERSION=1.29.2 --env PIP_NO_INDEX=1 --env CARGO_HTTP_CAINFO=/opt/_internal/certs.pem
          args: --release --locked --strip true --out dist --interpreter ${{ runner.os == 'Linux' && 'python3.10' || 'python' }}
        env:
          # The action's optional CFFI install is unused for PyO3.
          PIP_NO_INDEX: '1'
      - name: Test installed wheel
        run: uv run --no-project --isolated --python python --no-build --with dist/*.whl --with pytest python -m pytest tests
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: latest
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build source distribution
        run: uv build --sdist --out-dir dist
      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: latest
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - name: Publish to PyPI
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
